[package]
name = "humanbrain-kernel"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "humanbrain_kernel"
crate-type = ["cdylib"]

[dependencies]
rayon = "1.12.0"
sha2 = { version = "0.11.0", default-features = false }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
