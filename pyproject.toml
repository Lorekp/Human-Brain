[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "human-cell-brain"
version = "0.1.0"
description = "Autoregressive token prediction by a sparse simulation of human cortical cells"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
swe = ["mini-swe-agent==2.4.6"]

[project.scripts]
human-brain = "humanbrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
humanbrain = ["_native_src/Cargo.toml", "_native_src/Cargo.lock", "_native_src/src/*.rs"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
