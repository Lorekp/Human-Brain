[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "human-cell-brain"
version = "0.1.0"
description = "Autoregressive token prediction by a sparse simulation of human cortical cells"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["pytest>=8.0", "ruff==0.16.1"]
swe = ["mini-swe-agent==2.4.6"]
visualizer = ["dearpygui==2.3.1"]
g0 = ["minigrid==3.1.0"]
# Dense-ridge statistics/consolidation backend for the ladder harness
# (--ridge-backend scipy; required by the R0/R0-b mechanical gates,
# optional at runtime: 'auto' falls back to numpy without it).
gate = ["scipy>=1.14"]

[project.scripts]
human-brain = "humanbrain.cli:main"
human-brain-viz = "humanbrain.visualizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
humanbrain = [
    "_native_src/Cargo.toml",
    "_native_src/Cargo.lock",
    "_native_src/.cargo/config.toml",
    "_native_src/build.rs",
    "_native_src/src/**/*",
    "_native_src/src/**/.*",
    "_native_src/src/**/.*/**/*",
    "_native_src/vendor/**/*",
    "_native_src/vendor/**/.*",
    "_native_src/vendor/**/.*/**/*",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
