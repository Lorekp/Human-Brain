[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "human-cell-brain"
version = "0.1.0"
description = "Autoregressive token prediction by a sparse simulation of human cortical cells"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
swe = ["mini-swe-agent==2.4.6"]
visualizer = ["dearpygui==2.3.1"]

[project.scripts]
human-brain = "humanbrain.cli:main"
human-brain-viz = "humanbrain.visualizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
humanbrain = [
    "_native_src/Cargo.toml",
    "_native_src/Cargo.lock",
    "_native_src/.cargo/config.toml",
    "_native_src/src/*.rs",
    "_native_src/src/*.cu",
    "_native_src/vendor/**/*",
    "_native_src/vendor/**/.*",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
